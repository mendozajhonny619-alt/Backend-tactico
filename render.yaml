services:
  - type: web
    runtime: python
    name: jhonny-elite-api
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 -k uvicorn.workers.UvicornWorker main:app --bind 0.0.0.0:$PORT --timeout 120
    healthCheckPath: /ready
    envVars:
      - key: API_FOOTBALL_KEY
        sync: false
      - key: FOOTBALL_DATA_KEY
        sync: false
      - key: ODDS_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: WORKER_ENABLED
        value: "true"
      - key: WORKER_SINGLE_PROCESS_ONLY
        value: "true"
      - key: GLOBAL_SENIOR_SCOPE
        value: "true"
      - key: SCAN_INTERVAL_SECONDS
        value: "30"
      - key: POST_GOAL_RESCAN_SECONDS
        value: "15"
      - key: LIVE_DETAILS_BATCH_SIZE
        value: "20"
      - key: LIVE_DETAILS_MAX_MATCHES
        value: "200"
      - key: UNDER_MINUTE_MIN
        value: "75"
      - key: JHONNY_DEBUG_API_RAW
        value: "0"
      - key: CORS_ORIGINS
        fromService:
          name: jhonny-elite-panel
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    runtime: static
    name: jhonny-elite-panel
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: jhonny-elite-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_DASHBOARD_POLL_MS
        value: "15000"

services:
  - type: web
    runtime: python
    name: jhonny-elite-api
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 -k uvicorn.workers.UvicornWorker main:app --bind 0.0.0.0:$PORT --timeout 120
    healthCheckPath: /ready
    envVars:
      - key: API_FOOTBALL_KEY
        sync: false
      - key: FOOTBALL_DATA_KEY
        sync: false
      - key: ODDS_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: WORKER_ENABLED
        value: "true"
      - key: WORKER_SINGLE_PROCESS_ONLY
        value: "true"
      - key: MASTER_PROTOCOL_ENABLED
        value: "true"
      - key: SHADOW_MODE
        value: "false"
      - key: API_ECONOMY_MODE
        value: "true"
      - key: API_DAILY_RESERVE
        value: "300"
      - key: GLOBAL_SENIOR_SCOPE
        value: "false"
      - key: STRICT_COMPETITION_SCOPE
        value: "true"
      - key: ENFORCE_ALLOWED_LEAGUE_IDS
        value: "false"
      - key: SCAN_INTERVAL_SECONDS
        value: "30"
      - key: LIVE_BASE_CACHE_TTL_SECONDS
        value: "60"
      - key: POST_GOAL_RESCAN_SECONDS
        value: "15"
      - key: LIVE_DETAILS_BATCH_SIZE
        value: "20"
      - key: LIVE_DETAILS_MAX_MATCHES
        value: "40"
      - key: LIVE_DETAILS_CACHE_TTL_SECONDS
        value: "120"
      - key: LIVE_FALLBACK_DEEP_MATCHES
        value: "2"
      - key: LIVE_PLAYER_STATS_ENABLED
        value: "false"
      - key: UNDER_PREP_MINUTE
        value: "68"
      - key: UNDER_MINUTE_MIN
        value: "72"
      - key: UNDER_PREFERRED_MINUTE
        value: "75"
      - key: UNDER_TARGET_WINDOW_END
        value: "79"
      - key: UNDER_LATE_ENTRY_MINUTE
        value: "80"
      - key: UNDER_HARD_CUTOFF_MINUTE
        value: "84"
      - key: UNDER_CANDIDATE_MIN_CONFIDENCE
        value: "66"
      - key: CANDIDATE_PREMATCH_MIN_CONFIDENCE
        value: "72"
      - key: PUBLISH_MIN_CONFIDENCE
        value: "88"
      - key: OVER_PUBLISH_MIN_CONFIDENCE
        value: "88"
      - key: UNDER_PUBLISH_MIN_CONFIDENCE
        value: "90"
      - key: MASTER_MIN_CONSENSUS
        value: "4"
      - key: SIGNAL_MAX_SIMULTANEOUS
        value: "6"
      - key: STRONG_SIGNAL_CONFIDENCE
        value: "92"
      - key: PREMIUM_SIGNAL_CONFIDENCE
        value: "95"
      - key: MAX_PREMATCH_ENRICHMENTS_PER_CYCLE
        value: "1"
      - key: MAX_PUBLISHED_SIGNALS_PER_CYCLE
        value: "6"
      - key: ODDS_CACHE_TTL_SECONDS
        value: "300"
      - key: ODDS_MIN_CANDIDATE_SCORE
        value: "76"
      - key: UNDER_ODDS_PREFETCH_MIN_SCORE
        value: "66"
      - key: THE_ODDS_FALLBACK_ENABLED
        value: "true"
      - key: THE_ODDS_REGION
        value: "eu"
      - key: EDGE_MIN_PERCENT
        value: "5"
      - key: MIN_EXPECTED_VALUE
        value: "0.03"
      - key: MIN_DATA_TRUTH_SCORE
        value: "72"
      - key: MAX_SIGNAL_RISK_SCORE
        value: "45"
      - key: MIN_MATH_SUPPORT_OVER
        value: "72"
      - key: MIN_MATH_SUPPORT_UNDER
        value: "70"
      - key: REQUIRE_PREMATCH_FOR_OFFICIAL
        value: "true"
      - key: PREMATCH_ECONOMY_MODE
        value: "true"
      - key: PREMATCH_MAX_NEW_PACKAGES_PER_HOUR
        value: "8"
      - key: PREMATCH_PROVIDER_PREDICTION_ENABLED
        value: "false"
      - key: PREMATCH_LEAGUE_SAMPLE_ENABLED
        value: "false"
      - key: RESULTS_TIMEZONE
        value: "America/La_Paz"
      - key: RESULTS_CUTOFF_HOUR
        value: "23"
      - key: RESULTS_CUTOFF_MINUTE
        value: "30"
      - key: RESULTS_RETENTION_DAYS
        value: "365"
      - key: OFFICIAL_RESULTS_LIMIT
        value: "5000"
      - key: JHONNY_DEBUG_API_RAW
        value: "0"
      - key: CORS_ORIGINS
        fromService:
          name: jhonny-elite-panel
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    runtime: static
    name: jhonny-elite-panel
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: jhonny-elite-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_DASHBOARD_POLL_MS
        value: "15000"
